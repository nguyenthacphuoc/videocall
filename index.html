<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoCall - Gọi Điện</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .container { max-width: 500px; margin: 50px auto; padding: 20px; text-align: center; }
        h1 { color: #1877f2; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #166fe5; }
        #videoContainer { display: none; margin-top: 20px; }
        iframe { width: 100%; height: 500px; border: none; border-radius: 10px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <h1>📞 VideoCall</h1>
        
        <div id="authSection">
            <h2 id="authTitle">Đăng Ký / Đăng Nhập</h2>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="password" placeholder="Ít nhất 6 ký tự">
            </div>
            <button id="authBtn" onclick="handleAuth()">Đăng Ký</button>
            <p style="margin-top:10px;">
                <a href="#" onclick="toggleAuthMode()" id="toggleLink">Đã có tài khoản? Đăng nhập</a>
            </p>
        </div>
        
        <div id="mainSection" style="display:none;">
            <h3 id="userName"></h3>
            <button onclick="logout()" style="margin-bottom:20px;background:#ef4444;">Đăng Xuất</button>
            
            <div class="form-group">
                <label>ID phòng gọi:</label>
                <input type="text" id="roomId" placeholder="Nhập ID phòng...">
            </div>
            <button id="joinBtn" onclick="joinCall()">📞 Tham Gia Phòng</button>
            <button onclick="createRoom()" style="margin-top:10px;background:#10b981;">➕ Tạo Phòng Mới</button>
            
            <div id="videoContainer">
                <div id="jitsiContainer"></div>
            </div>
        </div>
    </div>

    <script src="https://meet.jit.si/external_api.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        let isLogin = false;
        let currentUser = null;
        let jitsiApi = null;

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('authTitle').textContent = isLogin ? 'Đăng Nhập' : 'Đăng Ký';
            document.getElementById('authBtn').textContent = isLogin ? 'Đăng Nhập' : 'Đăng Ký';
            document.getElementById('toggleLink').textContent = isLogin ? 'Chưa có tài khoản? Đăng ký' : 'Đã có tài khoản? Đăng nhập';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Vui lòng nhập email và mật khẩu!');
                return;
            }
            
            try {
                if (isLogin) {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    await auth.createUserWithEmailAndPassword(email, password);
                }
                
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('mainSection').style.display = 'block';
                document.getElementById('userName').textContent = '👤 ' + email;
                currentUser = auth.currentUser;
                
            } catch (error) {
                alert('Lỗi: ' + error.message);
            }
        }

        async function logout() {
            await auth.signOut();
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('mainSection').style.display = 'none';
            if (jitsiApi) jitsiApi.dispose();
        }

        function createRoom() {
            const roomId = Math.random().toString(36).substring(7);
            document.getElementById('roomId').value = roomId;
            joinCall();
        }

        function joinCall() {
            const roomId = document.getElementById('roomId').value.trim();
            if (!roomId) {
                alert('Vui lòng nhập ID phòng!');
                return;
            }
            
            document.getElementById('videoContainer').style.display = 'block';
            
            const domain = 'meet.jit.si';
            const options = {
                roomName: 'videocall-' + roomId,
                width: '100%',
                height: 500,
                parentNode: document.getElementById('jitsiContainer'),
                userInfo: {
                    displayName: currentUser ? currentUser.email : 'User'
                }
            };
            
            if (jitsiApi) jitsiApi.dispose();
            jitsiApi = new JitsiMeetExternalAPI(domain, options);
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('mainSection').style.display = 'block';
                document.getElementById('userName').textContent = '👤 ' + user.email;
            }
        });
    </script>
</body>
</html>
